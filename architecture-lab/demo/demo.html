<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Architecture Lab Demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 20px; }
      button, select { margin-right: 8px; margin-bottom: 8px; }
      pre { background: #111; color: #0f0; padding: 12px; border-radius: 8px; }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <h1>MediaRuntime Provider Lab</h1>

    <div class="row">
      <label for="providerSelect">Provider:</label>
      <select id="providerSelect">
        <option value="fake">FakeProvider</option>
        <option value="url">UrlProvider</option>
        <option value="local">LocalFolderProvider</option>
      </select>
      <button id="pickFolder">Pick Folder</button>
      <button id="rescan">Rescan</button>
      <strong id="providerLabel">FakeProvider</strong>
    </div>

    <div>
      <button id="open">Open default</button>
      <button id="next">Next</button>
      <button id="prev">Prev</button>
      <button id="shuffle">Shuffle</button>
      <button id="remove">Remove current</button>
      <button id="favorite">Toggle favorite</button>
    </div>

    <pre id="out"></pre>

    <script type="module" src="./demo.js"></script>
  </body>
</html>
